packages:
  - packages/*

allowBuilds:
  core-js: false
  esbuild: true

minimumReleaseAgeExclude:
  - typescript@7.1.0-beta
  - '@typescript/*'
  - axios-eventsource
  - yargs-file-commands
  - '@clidoc/core'
  - '@clidoc/yargs'

patchedDependencies:
  '@clidoc/yargs': patches/@clidoc__yargs.patch
