name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm tsc
      - run: pnpm lint
      - name: Check formatting
        run: pnpm exec oxfmt --check .
      - run: pnpm test
      - name: Verify published packages include dist
        run: |
          for pkg in packages/sdk packages/cli; do
            (cd "$pkg" && pnpm pack --dry-run) | grep -qx 'dist/index.js' || {
              echo "::error::dist/index.js missing from the packed tarball for $pkg; the publish step would ship a broken package."
              exit 1
            }
          done
      - name: Generate OpenCLI document
        run: node packages/cli/dist/bin/loa.js docgen --output opencli.json
      - name: Validate OpenCLI document
        uses: bhouston/clidoc-action@v1
        with:
          files: opencli.json
          specification: bcdxn
          format: json

  # The published SDK and CLI support Node >=22.
  node-compat:
    name: node-compat (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Smoke test
        working-directory: packages/cli
        run: |
          node dist/bin/loa.js --version
          node dist/bin/loa.js --help
          node --input-type=module -e "const sdk = await import('@landofassets/sdk'); if (sdk.getFileNameExtension('a.mtlx.zip') !== '.mtlx.zip') process.exit(1);"
